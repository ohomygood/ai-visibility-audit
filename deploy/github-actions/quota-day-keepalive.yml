# TEMPLATE (inactive): copy to .github/workflows/ to enable. Pushing workflow files needs a GitHub token with the `workflow` scope.
# Keeps the Render free API awake through the first ~100 minutes of each Gemini quota day (midnight
# America/Los_Angeles = 15:00/16:00 Beijing). Orders booked for "next slot" (paid while sold out) start then;
# the server re-queues them from Stripe on wake-up (aiv/server.py sync_from_stripe), and staying awake through
# the window means a delivered report isn't regenerated by a later cold start. Read-only pings, no secrets.
name: quota-day keep-alive
on:
  schedule:
    - cron: "3 7 * * *"    # 00:03 PDT
    - cron: "3 8 * * *"    # 00:03 PST
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - name: ping /api/capacity every 4 minutes
        env:
          EVENT: ${{ github.event_name }}
        run: |
          h=$(TZ=America/Los_Angeles date +%H)
          if [ "$EVENT" = "schedule" ] && [ "$h" != "00" ] && [ "$h" != "01" ]; then echo "PT hour $h: not the quota reset, skip"; exit 0; fi
          for i in $(seq 1 25); do
            curl -s -m 90 https://ai-visibility-audit-api.onrender.com/api/capacity || true; echo
            sleep 240
          done
